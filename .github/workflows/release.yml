name: Release

# 推送形如 v1.2.0 的 tag 时自动构建并发布；也可手动运行（只产出 artifact，不发布）
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 版本号
        id: ver
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-dev"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # 签名与公证需要在仓库 Secrets 里配置：
      #   DEVELOPER_ID_P12（Developer ID Application 证书 + 私钥导出的 .p12，base64）、DEVELOPER_ID_P12_PASSWORD、
      #   APPLE_ID、APPLE_TEAM_ID、APPLE_APP_PASSWORD（App 专用密码）。
      # 未配置时退回 ad-hoc 签名、不公证，流程照常完成（fork 也能跑）。
      - name: 导入签名证书
        id: cert
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          if [[ -z "$P12" ]]; then
            echo "::notice::未配置 DEVELOPER_ID_P12，使用 ad-hoc 签名且不公证"
            echo "identity=-" >> "$GITHUB_OUTPUT"; exit 0
          fi
          kc="$RUNNER_TEMP/build.keychain-db"; kcpw="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          id="$(security find-identity -v -p codesigning "$kc" | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)"/\1/')"
          [[ -n "$id" ]] || { echo "::error::证书里没有 Developer ID Application 身份"; exit 1; }
          echo "identity=$id" >> "$GITHUB_OUTPUT"

      - name: 编译
        env:
          SIGN_IDENTITY: ${{ steps.cert.outputs.identity }}
        run: VERSION="${{ steps.ver.outputs.version }}" ./build.sh

      - name: 公证并装订
        if: steps.cert.outputs.identity != '-'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ditto -c -k --keepParent VDScreenBar.app "$RUNNER_TEMP/notary.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notary.zip" --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait --timeout 20m
          xcrun stapler staple VDScreenBar.app
          spctl --assess --type execute --verbose=2 VDScreenBar.app

      - name: 打包
        run: |
          v="${{ steps.ver.outputs.version }}"
          mkdir dist
          ditto -c -k --keepParent VDScreenBar.app "dist/VDScreenBar-$v-arm64.zip"
          # DMG：拖入 /Applications 即装（staging 目录放 app + Applications 链接，卷根才是平的）
          mkdir -p dmg && ln -s /Applications dmg/Applications && cp -R VDScreenBar.app dmg/
          hdiutil create -volname VDScreenBar -srcfolder dmg \
            -ov -format UDZO "dist/VDScreenBar-$v.dmg"
          rm -r dmg
          (cd dist && shasum -a 256 *.zip *.dmg > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: 生成 Homebrew Formula 与 Cask
        if: github.ref_type == 'tag'
        run: |
          v="${{ steps.ver.outputs.version }}"
          url="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/VDScreenBar-$v-arm64.zip"
          sha="$(shasum -a 256 "dist/VDScreenBar-$v-arm64.zip" | cut -d' ' -f1)"
          sed -e "s|__URL__|$url|" -e "s|__VERSION__|$v|" -e "s|__SHA256__|$sha|" \
              packaging/homebrew/vdscreen.rb > dist/vdscreen.rb
          sed -e "s|__URL__|$url|" -e "s|__VERSION__|$v|" -e "s|__SHA256__|$sha|" \
              packaging/homebrew/vdscreen-cask.rb > dist/vdscreen-cask.rb
          ruby -c dist/vdscreen.rb
          ruby -c dist/vdscreen-cask.rb

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

      - name: 发布 GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes

      # 自动更新 Homebrew tap：需要在本仓库的 Secrets 里配置 TAP_TOKEN
      # （对 lyonDan/homebrew-tap 有写权限的 fine-grained PAT）；未配置则跳过，formula 仍在 Release 附件里
      - name: 更新 Homebrew tap
        if: github.ref_type == 'tag'
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [[ -z "$TAP_TOKEN" ]]; then echo "::notice::未配置 TAP_TOKEN，跳过 tap 更新"; exit 0; fi
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/lyonDan/homebrew-tap.git" tap
          mkdir -p tap/Formula && cp dist/vdscreen.rb tap/Formula/vdscreen.rb
          mkdir -p tap/Casks && cp dist/vdscreen-cask.rb tap/Casks/vdscreen.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/vdscreen.rb Casks/vdscreen.rb
          git diff --cached --quiet || git commit -m "vdscreen ${GITHUB_REF_NAME#v}" && git push
